compatibility_date = "2026-08-22"

[vars]
NEXT_PUBLIC_API_BASE_URL = "https://agent-playground-backend-dev.bubbleindexone-dev.workers.dev"
VITE_API_BASE_URL = "https://agent-playground-backend-dev.bubbleindexone-dev.workers.dev"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.dev]
name = "ai-playground-dev"

[env.dev.vars]
NEXT_PUBLIC_API_BASE_URL = "https://agent-playground-backend-dev.bubbleindexone-dev.workers.dev"
VITE_API_BASE_URL = "https://agent-playground-backend-dev.bubbleindexone-dev.workers.dev"

[env.dev.assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.production]
name = "ai-playground"

[env.production.vars]
NEXT_PUBLIC_API_BASE_URL = "https://agent-playground-backend-prod.bubbleindexone-dev.workers.dev"
VITE_API_BASE_URL = "https://agent-playground-backend-prod.bubbleindexone-dev.workers.dev"

[env.production.assets]
directory = "./dist"
not_found_handling = "single-page-application"
